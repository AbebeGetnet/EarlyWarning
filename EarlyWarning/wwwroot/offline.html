<!doctype html>
<html lang="am">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ከመስመር ውጭ</title>
    <style>
        body { margin: 0; font-family: "Nyala", "Abyssinica SIL", "Noto Sans Ethiopic", system-ui, sans-serif; background: #f5f6f6; color: #212529; }
        main { max-width: 560px; margin: 12vh auto; padding: 24px; background: #fff; border-top: 4px solid #007bff; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        h1 { font-size: 1.4rem; margin-top: 0; }
        p { line-height: 1.6; }
        a, button { display: inline-block; margin-top: 8px; padding: 8px 16px; border: 0; border-radius: 4px; background: #007bff; color: #fff; text-decoration: none; font: inherit; cursor: pointer; }
    </style>
</head>
<body>
<main>
    <h1>ከመስመር ውጭ ነዎት</h1>
    <p>ይህ ገጽ ገና በዚህ መሣሪያ ላይ አልተቀመጠም፤ ስለዚህ ያለ ኢንተርኔት መክፈት አይቻልም።</p>
    <p>የሳምንታዊ መረጃ መሙያ ገጹን (ዊዛርድ) ግንኙነት እያለ አንድ ጊዜ ከከፈቱት በኋላ ያለ ኢንተርኔትም ይከፈታል። ያለ ግንኙነት የሞሉትና የላኩት ሪፖርት በመሣሪያው ላይ ተቀምጦ ግንኙነት ሲመለስ በራሱ ይላካል።</p>
    <button type="button" onclick="location.reload()">እንደገና ሞክር</button>
</main>
</body>
</html>
